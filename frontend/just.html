<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="just.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo" onclick="showSection('hero')">
                <i class="fas fa-brain logo-icon"></i>
                MoodMatrix
            </div>
            <ul class="nav-links">
                <li><a href="#" onclick="showSection('hero')">Home</a></li>
                <li><a href="#" onclick="showSection('dashboard')">Dashboard</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#about">About</a></li>
            </ul>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Active</span>
            </div>
        </div>
    </nav>

    <section class="hero" id="heroSection">
        <div class="hero-content fade-in">
            <!-- Mode toggle button -->
            <div class="mode-toggle-container">
                <button id="modeToggleBtn" class="btn btn-toggle">
                    <i class="fas fa-calendar"></i> Switch to Daily Mode
                </button>
            </div>

            <!-- Tables in side-by-side layout -->
            <div class="tables-container">
                <!-- Cognitive Load Table -->
                <div class="table-wrapper">
                    <h2 class="table-title"><i class="fas fa-brain"></i> Cognitive Load Data (Editable)</h2>
                    <div class="table-scroll">
                        <table id="cognitiveTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>Time Slot</th>
                                    <th>Focus Level (0-1)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>09:00-10:00</td>
                                    <td><input type="number" step="0.01" min="0" max="1" value="0.9"></td>
                                </tr>
                                <tr>
                                    <td>10:00-11:00</td>
                                    <td><input type="number" step="0.01" min="0" max="1" value="0.85"></td>
                                </tr>
                                <tr>
                                    <td>11:00-12:00</td>
                                    <td><input type="number" step="0.01" min="0" max="1" value="0.7"></td>
                                </tr>
                                <tr>
                                    <td>14:00-15:00</td>
                                    <td><input type="number" step="0.01" min="0" max="1" value="0.5"></td>
                                </tr>
                                <tr>
                                    <td>18:00-19:00</td>
                                    <td><input type="number" step="0.01" min="0" max="1" value="0.65"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Subjects Table -->
                <div class="table-wrapper">
                    <h2 class="table-title"><i class="fas fa-book"></i> Subjects & Difficulty (Editable)</h2>
                    <div class="table-scroll">
                        <table id="subjectsTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>Subject</th>
                                    <th>Difficulty</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" value="Math"></td>
                                    <td>
                                        <select>
                                            <option selected>Hard</option>
                                            <option>Medium</option>
                                            <option>Easy</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="Physics"></td>
                                    <td>
                                        <select>
                                            <option>Hard</option>
                                            <option selected>Medium</option>
                                            <option>Easy</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="Chemistry"></td>
                                    <td>
                                        <select>
                                            <option>Hard</option>
                                            <option selected>Medium</option>
                                            <option>Easy</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="English"></td>
                                    <td>
                                        <select>
                                            <option>Hard</option>
                                            <option>Medium</option>
                                            <option selected>Easy</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <td><input type="text" value="History"></td>
                                    <td>
                                        <select>
                                            <option>Hard</option>
                                            <option>Medium</option>
                                            <option selected>Easy</option>
                                        </select>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Buttons Container -->
            <div class="buttons-container">
                <button id="generateBtn" class="btn btn-primary">
                    <i class="fas fa-wand-magic-sparkles"></i> Generate Timetable
                </button>
                <button id="editBtn" class="btn btn-secondary" style="display:none;">
                    <i class="fas fa-pencil"></i> Edit Timetable
                </button>
                <!-- <button id="downloadBtn" class="btn btn-secondary" style="display:none;">
                    <i class="fas fa-download"></i> Download PDF
                </button> -->
            </div>

            <!-- Generated Timetable Section -->
            <div id="timetable-section" class="timetable-section">
                <h2 class="section-title"><i class="fas fa-clock"></i> Generated Weekly Timetable</h2>

                <!-- Legend for subject colors -->
                <div class="legend-container" id="legendContainer" style="display:none;">
                    <h3 class="legend-title">Subject Color Legend</h3>
                    <div class="legend-items" id="legendItems"></div>
                </div>

                <div class="timetable-wrapper">
                    <table id="timetableTable" class="timetable">
                        <thead>
                            <tr id="headerRow">
                                <th class="time-header">Time Slot</th>
                            </tr>
                        </thead>
                        <tbody id="timetableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script>
        let isHourlyMode = true;
        let currentTimetableData = null;
        let subjectColors = {};

        const colorPalette = [
            { name: 'Math', bg: '#6366f1', text: '#ffffff' },        // Indigo (primary blend)
            { name: 'Physics', bg: '#8b5cf6', text: '#ffffff' },     // Violet (secondary blend)
            { name: 'Chemistry', bg: '#f59e0b', text: '#1f2937' },   // Amber (accent blend)
            { name: 'English', bg: '#14b8a6', text: '#ffffff' },     // Teal (accent blend)
            { name: 'History', bg: '#ec4899', text: '#ffffff' },     // Pink
            { name: 'Biology', bg: '#10b981', text: '#ffffff' },     // Emerald
            { name: 'Geography', bg: '#06b6d4', text: '#ffffff' },   // Cyan
            { name: 'Art', bg: '#a855f7', text: '#ffffff' },         // Purple
            { name: 'PE', bg: '#f97316', text: '#ffffff' },          // Orange
            { name: 'CS', bg: '#3b82f6', text: '#ffffff' }           // Blue
        ];

        const generateBtn = document.getElementById("generateBtn");
        const editBtn = document.getElementById("editBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const modeToggleBtn = document.getElementById("modeToggleBtn");

        modeToggleBtn.addEventListener("click", () => {
            isHourlyMode = !isHourlyMode;
            updateCognitiveTable();
            modeToggleBtn.innerHTML = isHourlyMode
                ? '<i class="fas fa-calendar"></i> Switch to Daily Mode'
                : '<i class="fas fa-calendar-days"></i> Switch to Hourly Mode';
        });

        function updateCognitiveTable() {
            const tbody = document.querySelector("#cognitiveTable tbody");
            tbody.innerHTML = "";

            if (isHourlyMode) {
                const slots = [
                    { time: "09:00-10:00", value: 0.9 },
                    { time: "10:00-11:00", value: 0.85 },
                    { time: "11:00-12:00", value: 0.7 },
                    { time: "14:00-15:00", value: 0.5 },
                    { time: "18:00-19:00", value: 0.65 }
                ];
                slots.forEach(slot => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = slot.time;
                    const input = document.createElement("input");
                    input.type = "number";
                    input.step = "0.01";
                    input.min = "0";
                    input.max = "1";
                    input.value = slot.value;
                    row.insertCell(1).appendChild(input);
                });
            } else {
                const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
                const values = [0.9, 0.6, 0.7, 0.5, 0.8];
                days.forEach((day, i) => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = day;
                    const input = document.createElement("input");
                    input.type = "number";
                    input.step = "0.01";
                    input.min = "0";
                    input.max = "1";
                    input.value = values[i];
                    row.insertCell(1).appendChild(input);
                });
            }
        }

        function initializeSubjectColors() {
            subjectColors = {};
            let colorIndex = 0;
            document.querySelectorAll("#subjectsTable tbody tr").forEach((row) => {
                const name = row.cells[0].querySelector("input").value.trim();
                if (!subjectColors[name]) {
                    const color = colorPalette[colorIndex % colorPalette.length];
                    subjectColors[name] = color;
                    colorIndex++;
                }
            });
        }

        generateBtn.addEventListener("click", async () => {
            initializeSubjectColors();

            let cognitiveData = {};

            if (isHourlyMode) {
                document.querySelectorAll("#cognitiveTable tbody tr").forEach((row) => {
                    const time = row.cells[0].textContent.trim();
                    const value = parseFloat(row.cells[1].querySelector("input").value);
                    cognitiveData[time] = value;
                });
            } else {
                document.querySelectorAll("#cognitiveTable tbody tr").forEach((row) => {
                    const day = row.cells[0].textContent.trim();
                    const value = parseFloat(row.cells[1].querySelector("input").value);
                    cognitiveData[day] = value;
                });
            }

            const subjects = {};
            document.querySelectorAll("#subjectsTable tbody tr").forEach((row) => {
                const name = row.cells[0].querySelector("input").value.trim();
                const difficulty = row.cells[1].querySelector("select").value;
                const weight = difficulty === "Hard" ? 5 : difficulty === "Medium" ? 3 : 1;
                subjects[name] = weight;
            });

            try {
                const response = await fetch("http://127.0.0.1:8000/timetable/generate_timetable", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cognitive_data: cognitiveData, subjects }),
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                currentTimetableData = data.weekly_timetable;
                displayTimetable(currentTimetableData);

            } catch (error) {
                alert("Error generating timetable: " + error.message);
                console.error("Error:", error);
            }
        });

        function displayTimetable(timetable) {
            const headerRow = document.getElementById("headerRow");
            const tbody = document.getElementById("timetableBody");

            headerRow.innerHTML = '<th class="time-header">Time Slot</th>';
            tbody.innerHTML = "";

            const days = Object.keys(timetable);
            const timeSlotsSet = new Set();

            // collect all slots
            days.forEach(day => {
                Object.keys(timetable[day]).forEach(slot => timeSlotsSet.add(slot));
            });

            const timeSlots = Array.from(timeSlotsSet);

            // create day headers
            days.forEach(day => {
                const th = document.createElement("th");
                th.textContent = day;
                headerRow.appendChild(th);
            });

            // create rows per time slot
            timeSlots.forEach(slot => {
                const row = tbody.insertRow();
                const timeCell = row.insertCell();
                timeCell.textContent = slot;
                timeCell.className = "time-cell";

                days.forEach(day => {
                    const cell = row.insertCell();
                    const subject = timetable[day][slot] || "-";
                    const input = document.createElement("input");
                    input.type = "text";
                    input.value = subject;
                    input.disabled = true;
                    input.className = "timetable-input";

                    if (subjectColors[subject]) {
                        const color = subjectColors[subject];
                        cell.style.backgroundColor = color.bg;
                        cell.style.color = color.text;
                        cell.className = "colored-cell";
                    }

                    cell.appendChild(input);
                });
            });

            displayLegend();
            document.getElementById("timetable-section").classList.add("active");
            editBtn.style.display = "inline-flex";
            downloadBtn.style.display = "inline-flex";
            editBtn.scrollIntoView({ behavior: "smooth" });
        }


        function displayLegend() {
            const legendContainer = document.getElementById("legendContainer");
            const legendItems = document.getElementById("legendItems");
            legendItems.innerHTML = "";

            Object.entries(subjectColors).forEach(([subject, color]) => {
                const item = document.createElement("div");
                item.className = "legend-item";
                item.innerHTML = `
                    <div class="legend-color" style="background-color: ${color.bg};"></div>
                    <span class="legend-label">${subject}</span>
                `;
                legendItems.appendChild(item);
            });

            legendContainer.style.display = "block";
        }

        editBtn.addEventListener("click", () => {
            const inputs = document.querySelectorAll("#timetableTable input");
            const editable = inputs[0].disabled;
            inputs.forEach(inp => inp.disabled = !editable);
            editBtn.innerHTML = editable
                ? '<i class="fas fa-floppy-disk"></i> Save Timetable'
                : '<i class="fas fa-pencil"></i> Edit Timetable';
        });

        downloadBtn.addEventListener("click", () => {
            const element = document.getElementById("timetable-section");
            const opt = {
                margin: 10,
                filename: 'timetable.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
            };
            html2pdf().set(opt).from(element).save();
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            updateCognitiveTable();
        });
    </script>
</body>

</html>
